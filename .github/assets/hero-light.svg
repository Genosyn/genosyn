<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Genosyn — companies can now run themselves">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28afc7" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#53c9db" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0.10" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e98ad" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0e98ad" stop-opacity="0" />
    </radialGradient>
    <clipPath id="card">
      <rect width="1200" height="400" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#fdf9f3" />
    <rect width="1200" height="400" fill="url(#wash)" />
    <circle cx="1090" cy="-40" r="300" fill="url(#glowA)" />
    <circle cx="120" cy="440" r="300" fill="url(#glowB)" />
    <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#1c1917" stroke-opacity="0.10" />
  </g>

  <g transform="translate(72 66)">
    <circle cx="14" cy="14" r="12" fill="none" stroke="#1c1917" stroke-width="2.6" />
    <text x="44" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6" fill="#1c1917">GENOSYN</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="212" font-size="72" font-weight="700" letter-spacing="-3" fill="#1c1917">Companies can now</text>
    <text x="72" y="290" font-size="72" font-weight="700" letter-spacing="-3" fill="#0e98ad">run themselves.</text>
    <text x="72" y="344" font-size="21" font-weight="500" fill="#57534e">The open-source operating system for autonomous companies.</text>
  </g>
</svg>
