name: Lint

on:
  # A fixed release-candidate branch can finish validation while main advances.
  workflow_dispatch:
  # The OSS Scanner files have no workflow of their own: App's
  # server/ossScanner.test.ts guards them, so a change to them runs this one.
  push:
    branches: [main]
    paths:
      - "App/**"
      - "CLI/**"
      - "Connect/**"
      - "Home/**"
      - ".github/workflows/lint.yml"
      - ".oss-scanner/**"
      - ".dockerignore"
      - ".nvmrc"
      - "SECURITY.md"
  pull_request:
    paths:
      - "App/**"
      - "CLI/**"
      - "Connect/**"
      - "Home/**"
      - ".github/workflows/lint.yml"
      - ".oss-scanner/**"
      - ".dockerignore"
      - ".nvmrc"
      - "SECURITY.md"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [App, Connect, Home]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project exists
        id: exists
        run: |
          if [ -f "package.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.project }}/package.json not present yet — skipping."
          fi

      - name: Setup Node
        if: steps.exists.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install
        if: steps.exists.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.exists.outputs.ready == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.exists.outputs.ready == 'true'
        run: npm run typecheck

      # App's suite is split across the `app-test` shards below.
      - name: Test
        if: steps.exists.outputs.ready == 'true' && matrix.project != 'App'
        run: npm test

  app-test:
    name: Test (App ${{ matrix.shard }}/${{ strategy.job-total }})
    # On one runner the suite took 47-58 minutes, longer than everything else
    # in this workflow put together. Node's test runner deals the test files
    # out across the shards, and each file still runs in its own process.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      # Node reads test-runner flags only up to the first file pattern, so
      # `npm test -- --test-shard=…` would quietly run the whole suite in every
      # shard. Splice the flag in after `tsx --test` instead, so package.json
      # stays the one place that says what the suite is.
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          script="$(node -p 'require("./package.json").scripts.test')"
          case "$script" in
            "tsx --test "*) ;;
            *)
              echo "::error::App's test script no longer starts with \"tsx --test\"; update how lint.yml shards it."
              exit 1
              ;;
          esac
          PATH="$PWD/node_modules/.bin:$PATH" sh -c "tsx --test --test-shard=$SHARD ${script#tsx --test }"

  chat-browser-test:
    name: Browser regressions (${{ matrix.part }}/${{ strategy.job-total }})
    # Run one after another, these suites took 10 minutes. Each part takes the
    # ones listed under its number, about 3-4 minutes of them, balanced by how
    # long each suite ran in CI. A new suite goes in whichever part is shortest.
    timeout-minutes: 15
    # Pinned: `ubuntu-latest` is now 26.04, where this Playwright can't install
    # Chromium, so the job would stop before running a single suite.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        working-directory: App
    env:
      GENOSYN_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium

      # Part 1
      - name: Test clipboard, uploads, drafts, and every AI composer
        if: matrix.part == 1
        run: npm run test:chat-images
      - name: Test a reply's code blocks and what the sanitizer lets through
        if: matrix.part == 1
        run: npm run test:chat-markdown
      - name: Test saved draft attachment downloads and editing
        if: matrix.part == 1
        run: npm run test:mail-draft-attachments
      - name: Test Home draft counts, mailbox review links, and live updates
        if: matrix.part == 1
        run: npm run test:home-mail-drafts
      - name: Test email AI review indicators and work timelines
        if: matrix.part == 1
        run: npm run test:mail-review-timeline
      - name: Test email recipients, forwarding, and scheduling meetings from email
        if: matrix.part == 1
        run: npm run test:mail-compose
      - name: Test public Base Forms, validation, and submissions
        if: matrix.part == 1
        run: npm run test:base-forms-browser
      - name: Test the Chat widget on another site, in a real frame
        if: matrix.part == 1
        run: npm run test:support-chat-widget

      # Part 2
      - name: Test Routine outcomes, employee day, and run-log navigation
        if: matrix.part == 2
        run: npm run test:work-outcomes
      - name: Test employee email analysis details, history, and source navigation
        if: matrix.part == 2
        run: npm run test:work-analysis
      - name: Test live browser recording and saved playback transitions
        if: matrix.part == 2
        run: npm run test:browser-recording-live
      - name: Test compact Home greeting, employee bubbles, and card layout
        if: matrix.part == 2
        run: npm run test:home-layout
      - name: Test running Routines, today's Runs, filters, and mobile layout
        if: matrix.part == 2
        run: npm run test:routine-activity
      - name: Test Home channel peek layout, states, and read behavior
        if: matrix.part == 2
        run: npm run test:home-channel-peek
      - name: Test Home repository work attention, pagination, and live refresh
        if: matrix.part == 2
        run: npm run test:home-repository-work
      - name: Test Work session model selection
        if: matrix.part == 2
        run: npm run test:work-session-models

      # Part 3
      - name: Test decision discussions, drafts, and concurrent employee chats
        if: matrix.part == 3
        run: npm run test:decision-discussions
      - name: Test SSH repository publishing setup
        if: matrix.part == 3
        run: npm run test:repository-settings
      - name: Test proactive setup and delivery choices
        if: matrix.part == 3
        run: npm run test:proactive
      - name: Test what a person sees when an AI Employee needs them, and reading an authenticator QR
        if: matrix.part == 3
        run: npm run test:input-request-card
      - name: Test asking a person end to end, with nothing faked but the AI Model
        if: matrix.part == 3
        run: npm run test:input-requests

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-image-browser-screenshots-${{ matrix.part }}
          path: output/playwright/*.png
          if-no-files-found: ignore

  onboarding-browser-test:
    name: Onboarding browser regressions
    # One more fixture build for the backup API keys suite; keep the headroom.
    timeout-minutes: 18
    # Pinned for the same reason as the Browser regressions job above.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: App
    env:
      GENOSYN_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # The fixture typecheck follows the mail fixture into Connect's source,
      # which resolves Connect's own dependencies, and the end-to-end browser
      # test drives the real Genosyn Connect service in-process.
      - name: Install Genosyn Connect
        run: npm ci
        working-directory: Connect
      - name: Typecheck onboarding browser fixtures
        run: npx tsc -p tsconfig.onboarding-tests.json
      - name: Test company direction, hiring, and Routine selection
        run: npm run test:onboarding
      - name: Test model discovery and verified connection forms
        run: npm run test:model-setup
      - name: Test adding, ordering, and removing an AI Model's backup API keys
        run: npm run test:model-api-keys
      - name: Test the company's AI Models, attached to several AI Employees
        run: npm run test:company-models
      - name: Test Gmail OAuth-only setup
        run: npm run test:mail-connect
      - name: Test hosted Gmail connection dialogs
        run: npm run test:hosted-google-modal
      - name: Test Gmail through Genosyn Connect, end to end
        run: npm run test:connect-sign-in
      - name: Build the client for the full app browser test
        run: npm run build:client
      - name: Test signup, company setup, hiring, and account recovery
        run: npm run test:onboarding-fullstack
      - name: Test passwordless passkey enrollment, sign-in, and replay protection
        run: npm run test:passkey-signin
      - name: Save onboarding screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-browser-screenshots
          path: output/playwright/*.png
          if-no-files-found: ignore

  cli-test:
    name: Test (CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: bash CLI/test-genosyn.sh

  saas-postgres:
    name: SaaS Postgres migrations and coordination
    timeout-minutes: 8
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genosyn_test
          POSTGRES_PASSWORD: genosyn_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genosyn_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - name: Test fresh migrations, replica coordination and sessions
        run: npm run test:saas-postgres
        env:
          GENOSYN_TEST_POSTGRES_URL: postgres://genosyn_test:genosyn_test@127.0.0.1:5432/postgres

  fresh-boot:
    name: Fresh-DB boot (App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Boot the compiled server against an EMPTY data dir so the full TypeORM
      # migration chain runs from scratch. This catches migrations that abort a
      # fresh install (e.g. a `DROP INDEX` on an index a pure migration-chain
      # boot never created) — which a synchronize-seeded dev DB never exercises.
      - name: Boot against a fresh database
        run: |
          rm -rf data
          NODE_ENV=production PORT=8471 node dist/server/index.js > /tmp/boot.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            if grep -q "listening on" /tmp/boot.log; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi   # process exited (crash)
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          echo "----- server boot log -----"
          cat /tmp/boot.log
          if [ "$ok" != "1" ]; then
            echo "::error::Server did not boot against a fresh database — the migration chain or startup crashed."
            exit 1
          fi
          echo "Server booted cleanly against a fresh database."
