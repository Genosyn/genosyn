name: Publish Helm chart

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths:
      - "Helm/**"
      - "CLI/deploy-saas.sh"
      - "CLI/test-deploy-saas.sh"
      - "package.json"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "Helm/**"
      - "CLI/deploy-saas.sh"
      - "CLI/test-deploy-saas.sh"
      - "package.json"
      - ".github/workflows/chart.yml"
  # release.yml creates the v*.*.* tag with GITHUB_TOKEN, which doesn't fire
  # the push trigger above — the release flow dispatches this workflow, same
  # as docker.yml.
  workflow_dispatch:

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Deployment profiles are operator-private and gitignored. CI creates
      # its own disposable examples rather than depending on local files.
      - name: Create synthetic SaaS profiles
        run: |
          mkdir -p Helm/Values
          for environment in test prod; do
            test ! -e "Helm/Values/${environment}.values.yaml"
            gmail_sign_in=false
            if [ "$environment" = prod ]; then gmail_sign_in=true; fi
            cat > "Helm/Values/${environment}.values.yaml" <<YAML
          ingress:
            enabled: true
            className: ""
            annotations: {}
            host: ${environment}.example.com
            tls:
              enabled: true
              secretName: ci-${environment}-tls
            gmailSignIn:
              enabled: ${gmail_sign_in}
              host: connect.example.com
              tlsSecretName: ci-connect-tls
          YAML
          done

      - name: Verify SaaS deployment commands
        run: npm run test:deploy

      - name: Verify inline secrets and upgrade preservation
        run: bash Helm/test-inline-secrets.sh

      - name: Verify Stripe billing bootstrap
        run: bash Helm/test-billing-bootstrap.sh

      - name: Verify portable Kubernetes resources
        run: bash Helm/test-portability.sh

      - name: Validate test and production SaaS profiles
        env:
          GENOSYN_BOOTSTRAP_ADMIN_EMAIL: ops@example.com
        run: |
          npm run --silent template-deploy-test > /dev/null
          npm run --silent template-deploy-prod > /dev/null

      - name: Verify the shared Gmail sign-in ingress
        run: |
          for environment in test prod; do
            helm template genosyn Helm/genosyn \
              -f "Helm/Values/${environment}.values.yaml" \
              --set config.bootstrapMasterAdminEmail=ops@example.com \
              -s templates/ingress.yaml > "${environment}-ingress.yaml"
          done
          helm template genosyn Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com \
            --set ingress.enabled=true --set ingress.host=chart-default.example.com \
            -s templates/ingress.yaml > default-ingress.yaml
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          function ingress(environment) {
            // Inspect this chart's fixed output; no external YAML dependency.
            const text = fs.readFileSync(`${environment}-ingress.yaml`, "utf8");
            assert.equal((text.match(/^kind: Ingress$/gm) || []).length, 1);
            const rules = text.split("\n  rules:\n")[1].split(/(?=^    - host: )/m).filter(block => block.trim());
            return { text, rules: rules.map(block => ({
              host: JSON.parse(/^    - host: (.+)$/m.exec(block)[1]),
              paths: [...block.matchAll(/^          - path: (.+)$/gm)].map(match => match[1]),
              pathTypes: [...block.matchAll(/^            pathType: (.+)$/gm)].map(match => match[1]),
              services: [...block.matchAll(/^                name: (.+)$/gm)].map(match => match[1]),
              ports: [...block.matchAll(/^                  number: (.+)$/gm)].map(match => match[1]),
            })) };
          }
          const prod = ingress("prod");
          assert.deepEqual(prod.rules.map(rule => rule.host), ["prod.example.com", "connect.example.com"]);
          const [app, connect] = prod.rules;
          assert.deepEqual(app.paths, ["/"]);
          assert.deepEqual(connect.paths, ["status", "start", "authorize", "callback", "poll", "refresh"].map(path => `/api/google-sign-in/${path}`));
          assert.deepEqual(connect.pathTypes, Array(6).fill("Exact"));
          assert.deepEqual(connect.services, Array(6).fill(app.services[0]));
          assert.deepEqual(connect.ports, Array(6).fill(app.ports[0]));
          assert.match(prod.text, /- hosts:\n        - "connect\.example\.com"\n      secretName: "ci-connect-tls"/);
          assert.match(prod.text, /- hosts:\n        - "prod\.example\.com"\n      secretName: "ci-prod-tls"/);
          for (const environment of ["test", "default"]) {
            const rendered = ingress(environment);
            assert.equal(rendered.rules.length, 1, `${environment}: Gmail host must be opt-in`);
            assert.deepEqual(rendered.rules[0].paths, ["/"]);
            assert(!rendered.text.includes("/api/google-sign-in/"));
          }
          NODE
          if helm template genosyn Helm/genosyn -f Helm/Values/prod.values.yaml \
            --set config.bootstrapMasterAdminEmail=ops@example.com \
            --set ingress.gmailSignIn.host=prod.example.com > /dev/null 2> gmail-host-collision.err; then
            echo "Gmail sign-in host must not collide with the main App host" >&2
            exit 1
          fi
          grep -q "ingress.gmailSignIn.host must differ from ingress.host" gmail-host-collision.err
          for invalid in ingress.enabled=false ingress.tls.enabled=false \
            ingress.gmailSignIn.host=https://connect.example.com \
            ingress.gmailSignIn.host=127.0.0.1 ingress.gmailSignIn.tlsSecretName=; do
            if helm template genosyn Helm/genosyn -f Helm/Values/prod.values.yaml \
              --set config.bootstrapMasterAdminEmail=ops@example.com \
              --set "$invalid" > /dev/null 2>&1; then
              echo "Expected Gmail ingress validation to reject $invalid" >&2
              exit 1
            fi
          done

      # The default posture is multi-tenant SaaS, which requires the bootstrap
      # admin email — lint renders templates, so it needs it too. SMTP is no
      # longer a chart value: it is configured post-boot at Admin → Email
      # transport, so nothing here sets it.
      - name: Helm lint
        run: |
          helm lint Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com
          helm lint Helm/genosyn -f Helm/genosyn/values-selfhost.yaml

      # Render the shapes users actually deploy, so a template regression
      # fails the PR and not the operator's upgrade.
      - name: Helm template smoke tests
        run: |
          # Default (multi-tenant SaaS) shape with the one required flag.
          helm template genosyn Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com > /dev/null
          # Production trimmings: TLS ingress, external Postgres, own secrets.
          helm template genosyn Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com \
            --set postgres.enabled=false \
            --set config.db.postgresUrlSecret.name=my-postgres \
            --set secrets.existingSecret=my-secrets \
            --set ingress.enabled=true \
            --set ingress.host=x.example.com \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=x-tls > /dev/null
          # Cluster without the UserNamespacesSupport gate.
          helm template genosyn Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com \
            --set sandbox.hostUsers=null > /dev/null
          # Single-tenant self-host shape.
          helm template genosyn Helm/genosyn \
            -f Helm/genosyn/values-selfhost.yaml > selfhost.yaml
          if grep -Eq 'procMount: Unmasked|seccompProfile:|hostUsers:' selfhost.yaml; then
            echo "self-hosted OpenCode must not require sandbox privileges" >&2
            exit 1
          fi
          # Explicit shared hosting still requires its selected isolation.
          if helm template genosyn Helm/genosyn \
            --set config.bootstrapMasterAdminEmail=ops@example.com \
            --set sandbox.enabled=false > /dev/null 2> shared-host.err; then
            echo "expected shared hosting with sandbox disabled to fail" >&2
            exit 1
          fi
          grep -q "sandbox.enabled must be true" shared-host.err
          # Negative test: a bare default template must fail closed with ONE
          # aggregated message naming everything missing at once.
          if helm template genosyn Helm/genosyn > /dev/null 2> bare-default.err; then
            echo "expected the bare default template to fail" >&2
            exit 1
          fi
          grep -q "config.bootstrapMasterAdminEmail is required" bare-default.err
          grep -q "values-selfhost.yaml" bare-default.err

      # The rendered config.js is mounted over /app/dist/config.js and must be
      # valid plain ESM — a template typo would otherwise crash the pod on
      # import, not at `helm install`.
      - name: Verify rendered App configuration
        run: |
          # Pull the literal block out of the rendered ConfigMap: everything
          # after `config.js: |`, de-indented by its four spaces.
          render() {
            helm template genosyn Helm/genosyn -s templates/configmap.yaml "$@" \
              | awk 'f { sub(/^    /, ""); print } /^  config\.js: \|/ { f = 1 }'
          }
          render --set config.bootstrapMasterAdminEmail=ops@example.com > default-config.mjs
          render -f Helm/genosyn/values-selfhost.yaml > selfhost-config.mjs
          render -f Helm/genosyn/values-selfhost.yaml --set sandbox.enabled=true > isolated-selfhost-config.mjs
          node --check default-config.mjs
          node --check selfhost-config.mjs
          node --check isolated-selfhost-config.mjs
          for environment in test prod; do
            render -f "Helm/Values/${environment}.values.yaml" \
              --set config.bootstrapMasterAdminEmail=ops@example.com > "${environment}-config.mjs"
            node --check "${environment}-config.mjs"
          done
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const { config: shared } = await import("./default-config.mjs");
          const { config: selfhost } = await import("./selfhost-config.mjs");
          const { config: isolated } = await import("./isolated-selfhost-config.mjs");
          assert.equal(shared.security.multiTenant, true);
          assert.equal(shared.agent.codingTools.executionMode, "bubblewrap");
          assert.equal(shared.agent.codingTools.allowUnsafeHostExecution, false);
          assert.equal(selfhost.security.multiTenant, false);
          assert.equal(selfhost.agent.codingTools.enabled, true);
          assert.equal(selfhost.agent.codingTools.executionMode, "host");
          assert.equal(selfhost.agent.codingTools.allowUnsafeHostExecution, true);
          assert.equal(isolated.agent.codingTools.executionMode, "bubblewrap");
          assert.equal(isolated.agent.codingTools.allowUnsafeHostExecution, false);
          for (const environment of ["test", "prod"]) {
            const { config } = await import(`./${environment}-config.mjs`);
            assert.equal(config.security.trustedProxyHops, 1, `${environment}: one trusted ingress proxy`);
            assert.equal(config.security.multiTenant, true, `${environment}: tenant isolation`);
            assert.equal(config.agent.codingTools.executionMode, "bubblewrap", `${environment}: sandbox`);
          }
          NODE

  publish:
    name: Package & push to GHCR
    runs-on: ubuntu-latest
    needs: lint
    # Publish only from release tags (or a manual dispatch of one).
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The chart version tracks the repo VERSION file — same value the image
      # tags carry, no `v` prefix. Chart.yaml's committed version is
      # overridden here so a release never depends on remembering to bump two
      # files.
      - name: Read VERSION
        id: ver
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set OCI repository (lowercase owner)
        id: repo
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${{ env.REGISTRY }}/${OWNER}/charts" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package Helm/genosyn \
            --version "${{ steps.ver.outputs.value }}" \
            --app-version "${{ steps.ver.outputs.value }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: helm push "genosyn-${{ steps.ver.outputs.value }}.tgz" "oci://${{ steps.repo.outputs.name }}"
