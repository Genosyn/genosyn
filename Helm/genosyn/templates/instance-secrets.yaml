{{- include "genosyn.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{/*
Set the instance secrets once and preserve them forever: the lookup
returns the existing secret when it is already in the cluster, so neither
`helm upgrade` nor a reinstall ever rotates them. Rotating sessionSecret only
logs everyone out — but rotating encryptionSecret would orphan every
ciphertext row (model API keys, Connection credentials) with no way back,
which is why this secret also carries `helm.sh/resource-policy: keep` and
survives `helm uninstall`, exactly like the bundled Postgres password.
(`helm template` has no cluster to look at and renders supplied inline values
or fresh random defaults — templating is not installing.)
*/}}
{{- $secretName := include "genosyn.instanceSecretsName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- include "genosyn.instanceSecretData" (dict "values" .Values.secrets "existing" $existing) | nindent 2 }}
{{- end }}
