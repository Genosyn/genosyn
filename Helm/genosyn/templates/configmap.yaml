{{/*
Genosyn's config is compiled into the image at /app/dist/config.js. The
blessed Kubernetes override is mounting this file over that path (subPath) —
the deployment does exactly that. The shape below mirrors App/config.ts
faithfully; it must stay valid plain ESM JavaScript (no TypeScript).
Secrets are read through process.env.* names the deployment injects.

The overlay REPLACES the whole config object, so every key the server still
reads must appear here. It is deliberately short: config.ts is now boot
configuration only (secrets, database coordinates, the security posture).
Everything operational — web tools, mail sync, meetings, the container's
browser, the agent's taint policy / member browsers / tool discovery, and the
system SMTP transport — lives in the database and is edited at Admin → Runtime
and Admin → Email transport.

A ConfigMap rendered by an OLDER chart still carries those blocks. That stays
harmless: nothing enumerates or validates config keys, so a stale key is
simply never read — and on the first boot after the upgrade the server copies
any surviving block into its AppSetting row (importLegacyConfigOverrides), so
the install keeps its behavior without an operator touching values.yaml. The
tenancy and execution mode it rendered are the exception: genosyn.validate
reads them from this ConfigMap so an upgrade never leaves shared multi-tenant
mode or the bubblewrap sandbox unconfirmed.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "genosyn.configName" . }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
data:
  config.js: |
    // Rendered by the genosyn Helm chart — edit values.yaml, not this file.
    // Values-managed defaults for the security block, defined separately so
    // config.extraJs can override a single field without restating the rest:
    //   security: { ...security, trustedProxyHops: 2 },
    const security = {
      // Single-tenant: one organization per install.
      multiTenant: false,
      encryptionSecret: process.env.GENOSYN_ENCRYPTION_SECRET ?? "change-me-in-production-too",
      previousEncryptionSecrets: [],
      secureCookies: "auto",
      sessionMaxAgeDays: 7,
      trustedProxyHops: {{ include "genosyn.trustedProxyHops" . }},
      outboundPrivateHostAllowlist: [],
      outboundRequestTimeoutMs: 15_000,
      outboundMaxResponseBytes: 25 * 1024 * 1024,
      authRateLimit: {
        windowMinutes: 15,
        maxAttempts: 10,
        blockMinutes: 15,
      },
      bootstrapMasterAdminEmail: {{ .Values.config.bootstrapMasterAdminEmail | quote }},
    };

    export const config = {
      dataDir: "/app/data",
      db: {
        driver: "{{ include "genosyn.dbDriver" . }}",
        sqlitePath: "/app/data/app.sqlite",
        postgresUrl: process.env.GENOSYN_POSTGRES_URL ?? "",
      },
      port: 8471,
      sessionSecret: process.env.GENOSYN_SESSION_SECRET ?? "change-me-in-production",
      security,
      agent: {
        // AI Employee commands run in this container as the App user, with
        // its filesystem and network authority. There is no OS sandbox.
        codingTools: {
          enabled: true,
          executionMode: "host",
          allowUnsafeHostExecution: true,
        },
        // Read only in multi-tenant mode, which this chart never renders.
        browserEnabledInMultiTenant: false,
      },
      {{- if .Values.config.extraJs }}
      // ── values.yaml config.extraJs ──
      {{- .Values.config.extraJs | trim | nindent 6 }}
      {{- end }}
    };
