{{- /* Operator annotations win over the ones an opt-in integration adds. */ -}}
{{- $annotations := deepCopy (default dict .Values.service.annotations) -}}
{{- if include "genosyn.gke.enabled" . -}}
{{- $gke := dict
  "cloud.google.com/neg" "{\"ingress\": true}"
  "cloud.google.com/backend-config" (printf "{\"default\": \"%s\"}" (include "genosyn.gke.backendConfigName" .)) -}}
{{- $annotations = merge $annotations $gke -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genosyn.fullname" . }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # `component: app` keeps the endpoints off the bundled Postgres pods, which
  # share the base selectorLabels.
  selector:
    {{- include "genosyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
