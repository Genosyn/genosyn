apiVersion: v1
kind: Service
metadata:
  name: {{ include "genosyn.fullname" . }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # `component: app` keeps the endpoints off the bundled Postgres pods, which
  # share the base selectorLabels.
  selector:
    {{- include "genosyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
