{{- include "genosyn.validate" . -}}
{{- $billing := default dict .Values.billing -}}
{{- if $billing.enabled }}
{{/*
This is a disposable first-boot input, not an encryption root. No keep or
lookup: Helm manages it normally, and the App atomically imports it only
when billing.settings does not exist. Saved Admin -> Billing settings win.
*/}}
{{- $settings := dict "enabled" true -}}
{{- range $field := list "secretKey" "webhookSecret" "growthMonthlyPriceId" "growthAnnualPriceId" "scaleMonthlyPriceId" "scaleAnnualPriceId" -}}
{{- $_ := set $settings $field (get $billing $field | trim) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "genosyn.billingBootstrapName" . }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
type: Opaque
data:
  settings.json: {{ $settings | toJson | b64enc | quote }}
{{- end }}
