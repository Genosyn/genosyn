{{- if and .Values.postgres.enabled (not .Values.postgres.passwordSecret.name) }}
{{/*
Generate the bundled Postgres password once and preserve it across upgrades:
the lookup returns the existing secret when it is already in the cluster, so
`helm upgrade` never rotates a password the database was initialized with.
(`helm template` has no cluster to look at and renders a fresh random value —
that is fine, templating is not installing.)
*/}}
{{- $secretName := include "genosyn.postgres.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
