{{- include "genosyn.validate" . -}}
{{- if and .Values.postgres.enabled (not .Values.postgres.passwordSecret.name) }}
{{/*
Set the bundled Postgres password once and preserve it across upgrades:
the lookup returns the existing secret when it is already in the cluster, so
`helm upgrade` never rotates a password the database was initialized with.
(`helm template` has no cluster to look at and renders an inline password
or a fresh random default — templating is not installing.)
*/}}
{{- $secretName := include "genosyn.postgres.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
  # Survive `helm uninstall`: the StatefulSet's pgdata PVC (from
  # volumeClaimTemplates) is not Helm-managed and outlives the release, and
  # Postgres only honors POSTGRES_PASSWORD at initdb time — so a reinstall
  # must reuse the password the surviving data directory was initialized with.
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- include "genosyn.postgresSecretData" (dict "values" .Values.postgres "existing" $existing) | nindent 2 }}
{{- end }}
