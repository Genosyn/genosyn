{{- if .Values.ingress.enabled }}
{{- $gmailSignIn := default dict .Values.ingress.gmailSignIn }}
{{/*
WebSockets and streamed replies share port 8471 with regular HTTP. Configure
the selected controller's upgrade support, timeouts, buffering and query-log
redaction through ingress.annotations or its own configuration. The standard
Ingress API has no portable timeout setting.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "genosyn.fullname" . }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName | quote }}
    {{- if $gmailSignIn.enabled }}
    - hosts:
        - {{ $gmailSignIn.host | quote }}
      secretName: {{ $gmailSignIn.tlsSecretName | quote }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "genosyn.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- if $gmailSignIn.enabled }}
    - host: {{ $gmailSignIn.host | quote }}
      http:
        paths:
          {{- range list "status" "start" "authorize" "callback" "poll" "refresh" }}
          - path: /api/google-sign-in/{{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "genosyn.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
