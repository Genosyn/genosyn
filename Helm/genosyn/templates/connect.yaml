{{- /*
Genosyn Connect, the hosted sign-in service (connect.enabled). A separate
image from the App with its own Service; ingress.connect routes the sign-in
hostname here. It keeps no state: it mounts no volume, runs with a read-only
filesystem, and its replicas share only the key in connect-key.yaml.
*/ -}}
{{- $connect := include "genosyn.connect" . | fromYaml }}
{{- if $connect.enabled }}
{{- $name := include "genosyn.connectFullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
    app.kubernetes.io/component: connect
spec:
  replicas: {{ $connect.replicaCount }}
  # Token renewal keeps working while a new version rolls out.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "genosyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: connect
  template:
    metadata:
      labels:
        {{- include "genosyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: connect
        {{- with $connect.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $connect.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Open requests finish within a few seconds of SIGTERM.
      terminationGracePeriodSeconds: 15
      containers:
        - name: connect
          image: {{ printf "%s:%s" $connect.image.repository (default .Chart.AppVersion $connect.image.tag) }}
          imagePullPolicy: {{ $connect.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8473
          env:
            - name: PORT
              value: "8473"
            - name: CONNECT_PUBLIC_URL
              value: {{ include "genosyn.connectPublicUrl" . | quote }}
            - name: CONNECT_TRUSTED_PROXY_HOPS
              value: {{ include "genosyn.trustedProxyHops" . | quote }}
            - name: CONNECT_GOOGLE_SCOPE_GROUPS
              value: {{ $connect.googleScopeGroups | toString | quote }}
            {{- with $connect.privacyUrl }}
            - name: CONNECT_PRIVACY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $connect.termsUrl }}
            - name: CONNECT_TERMS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $connect.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The chart's shared key, then the provider credentials. A key the
          # operator's own Secret also sets is taken from that Secret.
          envFrom:
            - secretRef:
                name: {{ include "genosyn.connectKeyName" . | quote }}
            - secretRef:
                name: {{ $connect.existingSecret | quote }}
          # The image's `node` user, by number so the kubelet can verify it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Connect waits on nothing, so ready is the same as alive.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          {{- with $connect.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- $annotations := dict }}
{{- if include "genosyn.gke.enabled" . }}
{{- $annotations = dict
  "cloud.google.com/neg" "{\"ingress\": true}"
  "cloud.google.com/backend-config" (printf "{\"default\": \"%s\"}" (include "genosyn.gke.connectBackendConfigName" .)) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "genosyn.labels" . | nindent 4 }}
    app.kubernetes.io/component: connect
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "genosyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: connect
{{- end }}
