# Default values for the genosyn chart.
#
# The chart runs Genosyn single-tenant: one organization per install. AI
# Employee commands run in the App container as the App user (`node`, uid
# 1000), with that user's filesystem and network authority over every company
# in the install. Give each unrelated organization its own install.
#
# A bare `helm install` works: bundled Postgres, one replica, a 20Gi data
# volume and chart-generated strong secrets. For real use add an Ingress with
# TLS, and set config.bootstrapMasterAdminEmail before anyone can reach it.
#
# There is no SMTP here on purpose. The system mail transport is configured
# after boot at Admin → Email transport and stored encrypted in the database;
# until it is set, boot prints a warning and verification / reset links go to
# the pod log (`kubectl logs -n <ns> deploy/<release>`).
#
# For SQLite on the data volume and no bundled Postgres — the same shape as the
# one-line Docker installer — use `helm install ... -f values-selfhost.yaml`.

image:
  repository: ghcr.io/genosyn/app
  # Empty means "this chart's appVersion". Image tags carry no `v` prefix:
  # the GitHub release is v1.155.0, the image is app:1.155.0.
  tag: ""
  pullPolicy: IfNotPresent

# Names of pre-created image pull secrets, e.g. [{ name: my-registry-cred }].
# GHCR images are public, so this is normally empty.
imagePullSecrets: []

# Keep this at 1. More than one replica is not supported for Repository work
# (its Git lock and running work sessions), ChatGPT subscription models, or
# Member browsers: each depends on state held in one App process. The rest of
# the App coordinates through Postgres (scheduled work, leases, live updates),
# so a second replica would also need config.db.driver: postgres and a
# ReadWriteMany volume mounted on every replica.
replicaCount: 1

# Recreate: the old pod releases the ReadWriteOnce volume before the new one
# attaches it, and two App processes never overlap during a rollout.
strategy: Recreate

service:
  type: ClusterIP
  port: 80
  # Optional annotations for the cluster's Service/load-balancer integration.
  # The chart adds provider annotations only for an opt-in integration such as
  # gke.enabled below; values given here win over them.
  annotations: {}

ingress:
  enabled: false
  # Name of an IngressClass installed in this cluster. Empty uses its default.
  className: ""
  # e.g. genosyn.example.com
  host: ""
  tls:
    enabled: false
    # Name of a TLS secret in the release namespace (cert-manager or hand-fed).
    secretName: ""
    # Let cert-manager issue and renew secretName, and the connect host's
    # tlsSecretName, through this Ingress. Requires cert-manager in the
    # cluster (a one-time cluster add-on, like the ingress controller). Each
    # Certificate starts from a temporary self-signed certificate, so an
    # Ingress that needs its Secret to exist (GKE) comes up before the first
    # issuance. Point both hostnames at the Ingress address in DNS.
    certManager:
      enabled: false
      # Use an existing Issuer or ClusterIssuer instead of the chart's own,
      # e.g. { kind: ClusterIssuer, name: letsencrypt }.
      issuerRef: {}
      # The chart's own Issuer (when issuerRef is empty): ACME over HTTP-01,
      # answered through this Ingress. Let's Encrypt production by default.
      server: https://acme-v02.api.letsencrypt.org/directory
      # Optional ACME account email for the certificate authority's notices.
      email: ""
  # Optional Genosyn Connect hostname on this same Ingress, routed to the
  # Connect service below (connect.enabled) — never to the App. The App public
  # URL stays ingress.host. Requires ingress + TLS above.
  # Effective defaults: enabled: false, host: "", tlsSecretName: "".
  # Each supplied field overrides legacy ingress.gmailSignIn, including false
  # or an empty string. Keep this empty map to preserve legacy upgrade values.
  connect: {}
  # connect:
  #   enabled: true
  #   host: connect.example.com
  #   tlsSecretName: connect-tls
  # WebSockets and streamed replies share port 8471 with regular HTTP. Configure
  # the chosen ingress controller's upgrade support, timeouts, and buffering
  # through its supported annotations or controller configuration. Kubernetes
  # Ingress has no portable timeout field. Configure its access logs to omit
  # query strings: OAuth callback URLs carry short-lived authorization codes.
  #
  # `/api/internal/*` is the AI Employee tool surface. The App refuses any
  # request to it that did not arrive on loopback, so publishing it is not
  # exploitable — but there is no reason for the ingress to forward it at all,
  # and blocking it there is one line of defence in depth. With
  # ingress-nginx:
  #
  #   annotations:
  #     nginx.ingress.kubernetes.io/server-snippet: |
  #       location /api/internal { deny all; return 404; }
  annotations: {}

# Opt-in integration with GKE's built-in Ingress, the external Application Load
# Balancer that serves Ingresses with no IngressClass. Off by default, which
# keeps every resource this chart renders portable. Enabled, the chart adds:
#   - a BackendConfig on the App Service: the timeout below for WebSockets and
#     streamed replies, the /api/health check, and load balancer request
#     logging off (OAuth callback URLs carry authorization codes);
#   - a FrontendConfig that redirects HTTP to HTTPS when the Ingress has TLS;
#   - optionally a Google-managed certificate for ingress.host and the connect
#     host, in place of ingress.tls Secrets and cert-manager;
#   - security.trustedProxyHops: 2, because the load balancer appends both the
#     client's address and its own to X-Forwarded-For.
gke:
  enabled: false
  backendConfig:
    # Seconds a request or WebSocket may stay open through the load balancer.
    timeoutSec: 3600
    drainingTimeoutSec: 30
  # Redirect HTTP to HTTPS at the load balancer when the Ingress has TLS.
  redirectToHttps: true
  # A reserved global static IP (gcloud compute addresses create NAME --global),
  # so DNS survives the Ingress being recreated. Empty uses an ephemeral address.
  staticIpName: ""
  managedCertificate:
    # A Google-managed certificate for ingress.host and the connect host, used
    # instead of ingress.tls. Google provisions it once every hostname resolves
    # to the Ingress address (DNS only, not through a proxy such as Cloudflare's).
    enabled: false
    # Keeps an existing ManagedCertificate's name when adopting it. Empty uses
    # the release's full name.
    name: ""

# Genosyn Connect, the hosted OAuth sign-in service (Connect/ in the source
# repository, image ghcr.io/genosyn/connect). It holds one registered OAuth app
# per provider so self-hosted installations can connect Gmail and other
# Integrations without registering their own. Only the operator of a public
# sign-in service runs it — Genosyn runs connect.genosyn.com — so an ordinary
# installation leaves this off; its App already uses that service.
#
# Enable it with ingress.connect, which routes that hostname here. The service
# keeps no data at all and needs no volume or database.
connect:
  enabled: false
  image:
    repository: ghcr.io/genosyn/connect
    # Empty means "this chart's appVersion".
    tag: ""
    pullPolicy: IfNotPresent
  # Any number works: replicas share nothing but CONNECT_SECRET, which the
  # chart generates once and keeps (the <release>-connect-key Secret).
  replicaCount: 1
  # Required: a pre-created Secret in the release namespace whose keys become
  # the service's environment — CONNECT_GOOGLE_CLIENT_ID and
  # CONNECT_GOOGLE_CLIENT_SECRET. A CONNECT_SECRET here takes precedence over
  # the chart's own. The chart never renders these values.
  existingSecret: ""
  # The HTTPS origin people and Google's redirects reach. Empty uses
  # https://<ingress.connect.host>.
  publicUrl: ""
  # Google products to offer, as Connect scope groups (gmail, calendar, drive,
  # docs, tasks, contacts, directory, chat, meet, analytics, search-console,
  # ads). Offer only what your Google app is verified for.
  googleScopeGroups: gmail
  # Linked from Connect's pages. Google's app verification asks for both.
  privacyUrl: ""
  termsUrl: ""
  # Extra environment variables, verbatim pod-spec syntax.
  env: []
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
  podAnnotations: {}
  podLabels: {}

# The /app/data volume. This must persist even when the database is Postgres:
# it holds materialized git checkouts, browser state, tool artifacts, and
# uploads. The encryption/session secrets live in a Kubernetes Secret (see
# `secrets`), not on this volume — but back the Secret up with the database:
# losing the encryption secret makes encrypted rows unreadable.
persistence:
  enabled: true
  size: 20Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  accessModes: [ReadWriteOnce]
  # Use a claim you manage yourself instead of the chart creating one.
  existingClaim: ""

config:
  db:
    # sqlite | postgres. Setting postgres.enabled below implies postgres.
    driver: postgres
    # For an EXTERNAL Postgres: a secret holding the full connection URL
    # (postgresql://user:pass@host:5432/db). Takes precedence over the
    # bundled postgres below.
    postgresUrlSecret:
      name: ""
      key: ""
  # Recommended: the email that claims the master-admin account. Register it
  # and open its verification link (in the pod log until SMTP is set); it
  # becomes master admin at once. Left empty, nobody is promoted until the App
  # restarts. Every App start without a master admin promotes the earliest
  # registered account either way, so claim it before sharing the address.
  bootstrapMasterAdminEmail: ""
  # The public HTTPS origin, e.g. https://genosyn.example.com, which email
  # links, OAuth callbacks and Secure session cookies follow. Empty derives it
  # from ingress.host when the Ingress has TLS. On Postgres a post-install /
  # post-upgrade Job stores it in the database once; an origin already changed
  # at Admin -> General is kept. Otherwise — no origin, or SQLite, whose
  # database the Job cannot reach — the first master admin's sign-in records
  # its browser origin.
  publicUrl: ""
  # Extra JavaScript spliced verbatim into the generated config.js, just
  # before the closing brace of the config object — so each line should be a
  # `key: value,` entry. A duplicate top-level key replaces the default block
  # wholesale; the generated file defines `const security = {...}` above the
  # object so you can override one security field without losing the rest:
  #   extraJs: |
  #     security: { ...security, trustedProxyHops: 2 },
  # Overriding `agent` instead means restating that whole block, since only
  # `security` is hoisted into a const above the object.
  # Only boot configuration belongs here. Operational settings (web tools,
  # mail sync, meetings, browser, agent taint policy / member browsers / tool
  # discovery) are database-backed and edited at Admin → Runtime; SMTP is at
  # Admin → Email transport. Adding them back here does nothing.
  extraJs: ""

secrets:
  # A pre-created secret with keys `sessionSecret` and `encryptionSecret`
  # (each a unique random string of at least 32 characters; they must differ).
  # Left empty, the chart manages a `<fullname>-instance-secrets` Secret
  # using the private values below, or fresh random values when both are empty.
  # It preserves them across upgrades AND
  # uninstall/reinstall (`helm.sh/resource-policy: keep`) — rotating the
  # encryptionSecret would orphan every encrypted row. Either way the App
  # receives explicit secrets via env and writes no secrets file of its own to
  # the data volume; it refuses to boot with weak ones.
  existingSecret: ""
  # Optional inline values, only in a private, untracked values file. Supply
  # both together: at least 32 characters each, and different from one another.
  # Do not combine with existingSecret. Once the chart-managed Secret exists,
  # these must match it exactly; a mismatch fails rather than rotating keys.
  sessionSecret: ""
  encryptionSecret: ""

# Extra environment variables for the app container, verbatim pod-spec syntax
# (name/value or valueFrom). Anything config.extraJs reads via process.env.*
# gets injected here.
env: []

# Bundled single-node Postgres — on by default so the default install has a
# database, but it is an evaluation database: no HA, no backups, no tuning.
# REAL production installs should set enabled: false and point
# config.db.postgresUrlSecret at a Postgres they operate (an operator,
# CloudNativePG, a managed instance).
postgres:
  enabled: true
  image: postgres:16
  database: genosyn
  username: genosyn
  # Optional inline bundled-Postgres password, only in a private values file.
  # Use URL-safe characters (letters, digits, '.', '_', '~', '-'). Do not
  # combine with passwordSecret. An existing chart-managed password must match.
  password: ""
  # A secret holding the password under `key`. Left empty, the chart generates
  # or uses postgres.password once and preserves it across upgrades — and across
  # uninstall/reinstall: the generated secret carries
  # `helm.sh/resource-policy: keep` so it outlives `helm uninstall` alongside
  # the pgdata PVC, which Postgres only initialized with that password.
  # An explicit password must be URL-safe — it is spliced into the
  # connection URL.
  passwordSecret:
    name: ""
    key: ""
  persistence:
    size: 10Gi
    storageClass: ""

# Requests are set by default so the pod lands in Burstable QoS rather than
# BestEffort. A BestEffort pod is the first thing the kubelet evicts under node
# pressure, and at the single-replica default that pod is the whole install.
#
# Deliberately requests without limits: requests only affect scheduling and
# eviction order, so raising the floor cannot OOM-kill a workload that was
# previously fine. AI Employee builds and `npm install`s run inside this
# container, so on a shared node consider limits too — but pick them from your
# own measurements, because a limit that is too low turns a slow Routine into a
# killed one.
#
#   resources:
#     requests: { cpu: 500m, memory: 1Gi }
#     limits:   { cpu: "2",  memory: 4Gi }
resources:
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
