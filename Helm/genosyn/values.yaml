# Default values for the genosyn chart.
#
# The short version: the DEFAULT posture is production multi-tenant SaaS —
# multiTenant on, Postgres, the bubblewrap sandbox granted, chart-generated
# strong secrets. A bare `helm install` fails fast at template time with one
# aggregated message listing the one value only you can supply
# (config.bootstrapMasterAdminEmail).
#
# There is no SMTP here on purpose. The system mail transport is configured
# after boot at Admin → Email transport and stored encrypted in the database;
# until it is set, boot prints a warning and verification / reset links go to
# the pod log (`kubectl logs -n <ns> deploy/<release>`).
#
# Running a private single-tenant install instead? Use the commented example
# next to this file: `helm install ... -f values-selfhost.yaml` — SQLite, no
# bundled Postgres, no securityContext demands, the same shape as the one-line
# Docker installer.

image:
  repository: ghcr.io/genosyn/app
  # Empty means "this chart's appVersion". Image tags carry no `v` prefix:
  # the GitHub release is v1.155.0, the image is app:1.155.0.
  tag: ""
  pullPolicy: IfNotPresent

# Names of pre-created image pull secrets, e.g. [{ name: my-registry-cred }].
# GHCR images are public, so this is normally empty.
imagePullSecrets: []

# Keep this at 1 unless you are running shared SaaS mode. More than one
# replica requires ALL of:
#   - config.multiTenant: true (Postgres leases + cross-replica fan-out)
#   - config.db.driver: postgres (SQLite cannot be shared between pods)
#   - persistence with a ReadWriteMany StorageClass, mounted on every replica
# A second replica against an RWO volume will simply never schedule.
replicaCount: 1

# Recreate is correct for the default single-replica RWO install: the old pod
# must release the volume before the new one can attach it. Switch to
# RollingUpdate only for multi-replica RWX installs.
strategy: Recreate

service:
  type: ClusterIP
  port: 80
  # Optional annotations for the cluster's Service/load-balancer integration.
  # The chart adds no cloud-specific annotations or custom resources.
  annotations: {}

ingress:
  enabled: false
  # Name of an IngressClass installed in this cluster. Empty uses its default.
  className: ""
  # e.g. genosyn.example.com
  host: ""
  tls:
    enabled: false
    # Name of a TLS secret in the release namespace (cert-manager or hand-fed).
    secretName: ""
  # Optional hosted sign-in hostname on this same Ingress and App Service.
  # Routes /api/connect and the six legacy /api/google-sign-in endpoints only.
  # The App public URL stays ingress.host. Requires ingress + TLS above.
  # Effective defaults: enabled: false, host: "", tlsSecretName: "".
  # Each supplied field overrides legacy ingress.gmailSignIn, including false
  # or an empty string. Keep this empty map to preserve legacy upgrade values.
  connect: {}
  # connect:
  #   enabled: true
  #   host: connect.example.com
  #   tlsSecretName: connect-tls
  # WebSockets and streamed replies share port 8471 with regular HTTP. Configure
  # the chosen ingress controller's upgrade support, timeouts, and buffering
  # through its supported annotations or controller configuration. Kubernetes
  # Ingress has no portable timeout field. Configure its access logs to omit
  # query strings: OAuth callback URLs carry short-lived authorization codes.
  #
  # `/api/internal/*` is the AI Employee tool surface. The App refuses any
  # request to it that did not arrive on loopback, so publishing it is not
  # exploitable — but there is no reason for the ingress to forward it at all,
  # and blocking it there is one line of defence in depth. With
  # ingress-nginx:
  #
  #   annotations:
  #     nginx.ingress.kubernetes.io/server-snippet: |
  #       location /api/internal { deny all; return 404; }
  annotations: {}

# The /app/data volume. This must persist even when the database is Postgres:
# it holds materialized git checkouts, browser state, tool artifacts, and
# uploads. The encryption/session secrets live in a Kubernetes Secret (see
# `secrets`), not on this volume — but back the Secret up with the database:
# losing the encryption secret makes encrypted rows unreadable.
persistence:
  enabled: true
  size: 20Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  accessModes: [ReadWriteOnce]
  # Use a claim you manage yourself instead of the chart creating one.
  existingClaim: ""

# Optional coding isolation for self-host; required for shared SaaS. Bubblewrap
# runs scoped commands and needs to create a user namespace and mount its
# own /proc — a stock pod may do neither. Enabling this sets on the container:
#     securityContext:
#       seccompProfile: { type: Unconfined }
#       procMount: Unmasked
# procMount: Unmasked additionally needs the cluster's ProcMountType feature
# gate and, depending on Kubernetes version, user namespaces (hostUsers: false)
# or a privileged container. Pod Security admission rejects both fields below
# the `privileged` level.
#
# Disabled, trusted single-tenant installs use host coding in the App container
# without an OS sandbox. MultiTenant mode instead refuses to boot without
# working isolation, so sandbox.enabled is mandatory
# there (and the cluster must actually honor the fields). Enabled by default
# because multiTenant is the default; values-selfhost.yaml turns it off.
sandbox:
  enabled: true
  # Rendered as pod-spec `hostUsers` when sandbox.enabled. Newer Kubernetes
  # (1.31+, ProcMountType beta) only honors procMount: Unmasked inside a
  # user-namespaced pod — hostUsers: false, which needs the cluster's
  # UserNamespacesSupport feature gate. Clusters without the gate can set
  # this to null to omit the field entirely.
  hostUsers: false

config:
  db:
    # sqlite | postgres. Setting postgres.enabled below implies postgres.
    driver: postgres
    # For an EXTERNAL Postgres: a secret holding the full connection URL
    # (postgresql://user:pass@host:5432/db). Takes precedence over the
    # bundled postgres below.
    postgresUrlSecret:
      name: ""
      key: ""
  # Shared SaaS mode — the default. Boot refuses unless the whole checklist
  # passes; the chart pre-validates its share at template time and reports
  # every missing value in one aggregated error. See the multi-tenant section
  # of the chart README. values-selfhost.yaml turns this off.
  multiTenant: true
  # The only email allowed to claim the first master-admin account (promotion
  # happens only after email verification, closing the internet race during
  # bootstrap). REQUIRED when multiTenant — a bare install fails at template
  # time until you set it.
  bootstrapMasterAdminEmail: ""
  # Extra JavaScript spliced verbatim into the generated config.js, just
  # before the closing brace of the config object — so each line should be a
  # `key: value,` entry. A duplicate top-level key replaces the default block
  # wholesale; the generated file defines `const security = {...}` above the
  # object so you can override one security field without losing the rest:
  #   extraJs: |
  #     security: { ...security, trustedProxyHops: 2 },
  # Overriding `agent` instead means restating that whole block, since only
  # `security` is hoisted into a const above the object.
  # Only boot configuration belongs here. Operational settings (web tools,
  # mail sync, meetings, browser, agent taint policy / member browsers / tool
  # discovery) are database-backed and edited at Admin → Runtime; SMTP is at
  # Admin → Email transport. Adding them back here does nothing.
  extraJs: ""

secrets:
  # A pre-created secret with keys `sessionSecret` and `encryptionSecret`
  # (each a unique random string of at least 32 characters; they must differ).
  # Left empty, the chart manages a `<fullname>-instance-secrets` Secret
  # using the private values below, or fresh random values when both are empty.
  # It preserves them across upgrades AND
  # uninstall/reinstall (`helm.sh/resource-policy: keep`) — rotating the
  # encryptionSecret would orphan every encrypted row. Either way the app
  # receives explicit strong secrets via env, which is what multiTenant
  # requires (shared SaaS refuses the managed on-disk secrets file).
  existingSecret: ""
  # Optional inline values, only in a private, untracked values file. Supply
  # both together: at least 32 characters each, and different from one another.
  # Do not combine with existingSecret. Once the chart-managed Secret exists,
  # these must match it exactly; a mismatch fails rather than rotating keys.
  sessionSecret: ""
  encryptionSecret: ""

# Optional first-boot import for paid plans. Keep credentials only in private,
# untracked values files. These become an encrypted billing.settings row only
# when no billing settings have been saved; Admin -> Billing owns later edits.
# Disabling this block or changing its values never changes saved billing.
billing:
  enabled: false
  secretKey: ""
  webhookSecret: ""
  growthMonthlyPriceId: ""
  growthAnnualPriceId: ""
  scaleMonthlyPriceId: ""
  scaleAnnualPriceId: ""

# Extra environment variables for the app container, verbatim pod-spec syntax
# (name/value or valueFrom). Anything config.extraJs reads via process.env.*
# gets injected here.
env: []

# Bundled single-node Postgres — on by default so the default install has a
# database, but it is an evaluation database: no HA, no backups, no tuning.
# REAL production installs should set enabled: false and point
# config.db.postgresUrlSecret at a Postgres they operate (an operator,
# CloudNativePG, a managed instance).
postgres:
  enabled: true
  image: postgres:16
  database: genosyn
  username: genosyn
  # Optional inline bundled-Postgres password, only in a private values file.
  # Use URL-safe characters (letters, digits, '.', '_', '~', '-'). Do not
  # combine with passwordSecret. An existing chart-managed password must match.
  password: ""
  # A secret holding the password under `key`. Left empty, the chart generates
  # or uses postgres.password once and preserves it across upgrades — and across
  # uninstall/reinstall: the generated secret carries
  # `helm.sh/resource-policy: keep` so it outlives `helm uninstall` alongside
  # the pgdata PVC, which Postgres only initialized with that password.
  # An explicit password must be URL-safe — it is spliced into the
  # connection URL.
  passwordSecret:
    name: ""
    key: ""
  persistence:
    size: 10Gi
    storageClass: ""

# Requests are set by default so the pod lands in Burstable QoS rather than
# BestEffort. A BestEffort pod is the first thing the kubelet evicts under node
# pressure, and at the single-replica default that pod is the whole install.
#
# Deliberately requests without limits: requests only affect scheduling and
# eviction order, so raising the floor cannot OOM-kill a workload that was
# previously fine. Shared SaaS should add limits as well — one tenant's build
# or `npm install` inside the sandbox otherwise competes freely for the node —
# but pick them from your own measurements, because a limit that is too low
# turns a slow Routine into a killed one.
#
#   resources:
#     requests: { cpu: 500m, memory: 1Gi }
#     limits:   { cpu: "2",  memory: 4Gi }
resources:
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
