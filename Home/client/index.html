    <!-- Two variable superfamilies and one italic serif. Archivo carries
         display and prose separated by its WIDTH axis (see .t-display /
         .t-cond in index.css); Martian Mono is the data face; Newsreader
         Italic is the one voice with a different skeleton, used for figure
         captions, margin notes and the colophon.

         Note for anyone reaching for a glyph: the served latin subset covers
         U+2191 (up), U+2193 (down) and U+2212 (minus) but NOT U+2192 (right).
         A literal right arrow falls back to a system face mid-line. Draw one
         as inline SVG instead. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..800&family=Martian+Mono:wdth,wght@75..112.5,300..700&family=Newsreader:ital,opsz,wght@1,6..72,300..500&display=swap"
      rel="stylesheet"
    />
