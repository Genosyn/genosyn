    <!-- Critical launch styles work before the application bundle arrives.
         React replaces this markup with the matching SplashScreen while the
         session loads, then removes it as soon as the app is ready. -->
    <style>
      [data-app-splash] {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 32px;
        background: #000;
        color: #fff;
      }
      [data-app-splash] svg {
        width: 240px;
        max-width: 100%;
        height: auto;
      }
    </style>

  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <div data-app-splash role="status" aria-label="Loading Genosyn">
        <!-- Same lockup as components/Logo.tsx; inline so first paint does not
             depend on JavaScript or an image request. -->
        <svg viewBox="0 0 140 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Genosyn">
          <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2.4" />
          <text x="36" y="22" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4" fill="currentColor">GENOSYN</text>
        </svg>
      </div>
    </div>
    <!-- Database-backed, master-admin supplied browser code. The /api path is
         deliberate: the service worker must never retain code after removal. -->
    <script vite-ignore src="/api/app/custom-javascript-loader.js"></script>
