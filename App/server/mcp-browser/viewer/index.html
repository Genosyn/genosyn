<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Genosyn — live browser</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #chrome {
        flex: 0 0 auto;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      #statusbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 0;
        font-size: 12px;
        line-height: 1.3;
        min-height: 28px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #475569;
        flex: 0 0 auto;
        transition: background-color 150ms ease;
      }
      .dot.live { background: #10b981; box-shadow: 0 0 6px #10b981; }
      .dot.pending { background: #f59e0b; }
      .dot.closed { background: #94a3b8; }
      #status-text {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #cbd5e1;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(30, 64, 175, 0.25);
        color: #93c5fd;
        flex: 0 0 auto;
      }
      .badge.driving { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
      #takeover {
        appearance: none;
        background: #334155;
        border: 1px solid #475569;
        color: #e2e8f0;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      #takeover:hover { background: #475569; }
      #takeover.active { background: #10b981; border-color: #10b981; color: #0f172a; }
      #takeover.active:hover { background: #34d399; border-color: #34d399; }
      #takeover:disabled { opacity: 0.5; cursor: default; }

      /* ---------- address bar ---------- */
      #omnibox {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px 8px;
      }
      .navbtn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #94a3b8;
        cursor: pointer;
      }
      .navbtn:hover:not(:disabled) { background: #334155; color: #e2e8f0; }
      .navbtn:disabled { opacity: 0.35; cursor: default; }
      #url {
        flex: 1 1 auto;
        min-width: 0;
        height: 26px;
        padding: 0 9px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, monospace;
        font-size: 11px;
        text-overflow: ellipsis;
        outline: none;
      }
      #url:read-only { border-color: transparent; background: #172033; color: #94a3b8; }
      #url:not(:read-only):hover { border-color: #475569; }
      #url:focus { border-color: #6366f1; color: #e2e8f0; }
      #go {
        display: none;
        flex: 0 0 auto;
        appearance: none;
        height: 26px;
        padding: 0 10px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #334155;
        color: #e2e8f0;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      #go.visible { display: inline-flex; align-items: center; }
      #go:hover { background: #475569; }
      #notice {
        display: none;
        padding: 0 10px 8px;
        font-size: 11px;
        line-height: 1.4;
        color: #fca5a5;
      }
      #notice.visible { display: block; }

      /* ---------- viewport ---------- */
      #canvas-wrap {
        flex: 1 1 auto;
        position: relative;
        overflow: hidden;
        background: #020617;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        background: #fff;
        box-shadow: 0 0 0 1px #1e293b;
        cursor: default;
        outline: none;
      }
      canvas.takeover { cursor: crosshair; box-shadow: 0 0 0 1px #10b981; }
      /* A dropped connection keeps the last frame on screen — dimmed, so it
         reads as stale rather than live. Blanking it would be a worse lie. */
      canvas.stale { opacity: 0.45; transition: opacity 200ms ease; }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #94a3b8;
        font-size: 13px;
        text-align: center;
        padding: 24px;
        pointer-events: none;
      }
      #overlay.hidden { display: none; }
      #overlay .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #334155;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #overlay h1 {
        font-size: 14px;
        font-weight: 600;
        color: #e2e8f0;
        margin: 0;
      }
      #overlay p { margin: 0; max-width: 360px; line-height: 1.5; }
      .hint {
        font-size: 10px;
        color: #64748b;
        flex: 0 0 auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #overlay .spinner { animation-duration: 2s; }
        canvas.stale { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="chrome">
        <div id="statusbar" role="status" aria-live="polite">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Connecting…</span>
          <span class="hint" id="status-hint"></span>
          <span class="badge" id="status-badge">Observing</span>
          <button id="takeover" type="button" aria-pressed="false">Take over</button>
        </div>
        <form id="omnibox" autocomplete="off">
          <button class="navbtn" id="nav-back" type="button" title="Back" aria-label="Back" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13" /></svg>
          </button>
          <button class="navbtn" id="nav-forward" type="button" title="Forward" aria-label="Forward" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 3 11 8 6 13" /></svg>
          </button>
          <button class="navbtn" id="nav-reload" type="button" title="Reload" aria-label="Reload" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.3 8a5.3 5.3 0 1 1-1.6-3.8" /><polyline points="13.4 2.2 13.4 5.2 10.4 5.2" /></svg>
          </button>
          <input
            id="url"
            type="text"
            readonly
            spellcheck="false"
            autocapitalize="off"
            autocorrect="off"
            aria-label="Address"
            placeholder="Take over to type an address"
          />
          <button id="go" type="submit">Go</button>
        </form>
        <div id="notice" role="alert"></div>
      </div>
      <div id="canvas-wrap">
        <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
        <div id="overlay">
          <div class="spinner"></div>
          <h1>Waiting for the agent</h1>
          <p>The AI hasn&apos;t opened a page yet. The live view will start the moment it does.</p>
        </div>
      </div>
    </div>
    <script src="./view.js" type="module"></script>
  </body>
</html>
